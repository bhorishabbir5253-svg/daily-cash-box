<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e40af">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Daily Cash Box</title>
<style>
:root{--b:#1e40af;--g:#15803d;--r:#b91c1c;--bg:#f1f5f9}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,Segoe UI,sans-serif;background:var(--bg);color:#0f172a;padding-bottom:96px}
header{background:var(--b);color:#fff;padding:10px 14px}
h1{margin:0 0 8px;font-size:20px}
h1 small{display:block;font-size:12px;font-weight:400;opacity:.85}
.bar{display:flex;flex-wrap:wrap;gap:6px}
button,input{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #cbd5e1}
button{background:#fff;cursor:pointer}
button.p{background:var(--b);color:#fff;border:0}
main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
@media(max-width:800px){main{grid-template-columns:1fr}}
.panel{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px #0002}
h2{margin:0 0 8px;font-size:18px}
.in h2{color:var(--g)} .out h2{color:var(--r)}
.entry{position:relative}
.entry input{width:100%;font-size:20px}
.list{position:absolute;z-index:5;left:0;right:0;background:#fff;border:2px solid var(--b);border-radius:10px;margin-top:4px;outline:0}
.opt{padding:12px 14px;font-size:18px;cursor:pointer}
.opt.on{background:var(--b);color:#fff}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{padding:6px;border-bottom:1px solid #e2e8f0;text-align:left}
td button{padding:2px 8px}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -2px 8px #0003;display:flex;justify-content:space-around;align-items:center;padding:8px;gap:6px;flex-wrap:wrap}
footer div{text-align:center;font-size:13px}
footer b{display:block;font-size:17px}
#banner{margin:12px 12px 0;padding:10px;border-radius:10px;background:#dbeafe;display:none}
dialog{border:0;border-radius:14px;padding:18px;width:min(92vw,420px)}
dialog input{width:100%}
#res{margin:10px 0;font-size:22px;font-weight:700}
.row{display:flex;gap:8px;margin-top:10px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:99}
@media print{.bar,footer,.entry,#banner,td button{display:none}}
</style>
</head>
<body>
<header>
  <h1>Daily Cash Box <small>Maharashtra Industrial Suppliers, Baramati &nbsp;<span id="pd"></span></small></h1>
  <div class="bar">
    <button id="prev">◀</button>
    <input type="date" id="date">
    <button id="next">▶</button>
    <button id="hist">History</button>
    <button id="bak">Backup</button>
    <button id="rst">Restore</button>
    <button id="prt">Print</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
</header>

<div id="banner"></div>

<main>
  <section class="panel in">
    <h2>Incoming</h2>
    <div class="entry">
      <input id="amt-in" placeholder="Incoming amount, then Enter" inputmode="decimal" enterkeyhint="next" autocomplete="off">
      <div class="list" id="list-in" tabindex="0" hidden></div>
    </div>
    <table><thead><tr><th>Incoming Amount</th><th>Type</th><th>Time</th><th></th></tr></thead><tbody id="rows-in"></tbody></table>
  </section>

  <section class="panel out">
    <h2>Outgoing</h2>
    <div class="entry">
      <input id="amt-out" placeholder="Outgoing amount, then Enter" inputmode="decimal" enterkeyhint="next" autocomplete="off">
      <div class="list" id="list-out" tabindex="0" hidden></div>
    </div>
    <table><thead><tr><th>Outgoing Amount</th><th>Reason</th><th>Time</th><th></th></tr></thead><tbody id="rows-out"></tbody></table>
  </section>
</main>

<footer>
  <div>Total Incoming<b id="t-in"></b></div>
  <div>Total Outgoing<b id="t-out"></b></div>
  <div>Cash in Box<b id="t-box"></b></div>
  <button class="p" id="tally">Tally</button>
</footer>

<dialog id="dlg"></dialog>
<div id="toast"></div>

<script>
// ---------- Settings and data ----------
const OPTS = {
  in:  ['Cash Balance', 'Advance', 'Cash Sale', 'Online Sale', 'Udhary'],
  out: ['Tempo', 'Transport', 'Tea', 'Water', 'Own Work', 'Collection', 'Petrol', 'Udhary Jama']
};
const KEY = 'cashbox_v1';
const $ = id => document.getElementById(id);
const dlg = $('dlg');
let db = load();
let date = new Date().toLocaleDateString('en-CA');   // today as YYYY-MM-DD
let pick = null;                                      // option being chosen

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { days: {} }; }
  catch (e) { return { days: {} }; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { alert('Could not save data!'); }
}
// get (or create) the record of the selected day
const day = () => db.days[date] || (db.days[date] = { entries: [], closed: false, counted: null, diff: null, status: null });

// ---------- Helpers ----------
const r2  = n => Math.round(n * 100) / 100;
const fmt = n => '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const sum = (list, side) => r2(list.filter(e => e.side === side).reduce((a, e) => a + e.amount, 0));
const stat = d => d === 0 ? 'Correct (0)' : d > 0 ? fmt(d) + ' More' : fmt(-d) + ' Less';
function toast(m) {
  const t = $('toast'); t.textContent = m; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 1800);
}
const locked = () => day().closed && (toast('Day is closed. Unlock it first.'), true);

// ---------- Add / edit / delete ----------
function add(side, amount, label, note = '') {
  const d = day();
  const id = Date.now() + Math.random();
  const time = new Date().toTimeString().slice(0, 5);
  d.entries.push({ id, side, amount, label, note, pair: null, time });
  // Online Sale in incoming also goes to outgoing, linked by "pair"
  if (side === 'in' && label === 'Online Sale') {
    d.entries[d.entries.length - 1].pair = id;
    d.entries.push({ id: id + 0.5, side: 'out', amount, label: 'Online Sale', pair: id, time });
  }
  save(); render();
}
function del(id) {
  if (locked()) return;
  const d = day(), e = d.entries.find(x => x.id === id);
  if (!e || !confirm('Delete this entry?')) return;
  d.entries = d.entries.filter(x => x.id !== id && !(e.pair && x.pair === e.pair));
  save(); render();
}
function edit(id) {
  if (locked()) return;
  const d = day(), e = d.entries.find(x => x.id === id);
  const v = parseFloat(prompt('New amount', e.amount));
  if (!(v > 0)) return;
  d.entries.forEach(x => { if (x.id === id || (e.pair && x.pair === e.pair)) x.amount = v; });
  if (e.label === 'Udhary' || e.label === 'Udhary Jama') {
    const n = prompt('Person name', e.note || '');
    if (n !== null) e.note = n.trim();
  }
  save(); render();
}
function unlock() {
  if (confirm('Unlock this day for editing?')) { day().closed = false; save(); render(); }
}
function useOpen(p) {
  if (locked()) return;
  const v = db.days[p].counted;
  if (v > 0) add('in', v, 'Cash Balance'); else toast('Last closing was 0');
}

// ---------- Draw the screen ----------
function render() {
  const d = day();
  $('date').value = date; $('pd').textContent = date;
  ['in', 'out'].forEach(s => {
    $('rows-' + s).innerHTML = d.entries.filter(e => e.side === s).map(e =>
      `<tr><td><b>${fmt(e.amount)}</b></td><td>${e.label}${e.pair ? ' 🔗' : ''}${e.note ? '<br><small>' + esc(e.note) + '</small>' : ''}</td><td>${e.time}</td>
       <td><button onclick="edit(${e.id})">✎</button> <button onclick="del(${e.id})">🗑</button></td></tr>`).join('');
    $('amt-' + s).disabled = d.closed;
  });
  const i = sum(d.entries, 'in'), o = sum(d.entries, 'out');
  $('t-in').textContent = fmt(i);
  $('t-out').textContent = fmt(o);
  $('t-box').textContent = fmt(r2(i - o));

  const b = $('banner');
  if (d.closed) {
    b.style.display = 'block';
    b.innerHTML = `Day closed: <b>${d.status}</b> (counted ${fmt(d.counted)}) <button onclick="unlock()">Unlock</button>`;
  } else {
    const p = Object.keys(db.days).filter(k => k < date && db.days[k].closed).sort().pop();
    if (p && !d.entries.length) {
      b.style.display = 'block';
      b.innerHTML = `Last closing (${p}): <b>${fmt(db.days[p].counted)}</b> <button onclick="useOpen('${p}')">Use as Cash Balance</button>`;
    } else b.style.display = 'none';
  }
}

// ---------- Keyboard flow: amount -> Enter -> option list -> arrows -> Enter ----------
['in', 'out'].forEach(s => {
  const a = $('amt-' + s), l = $('list-' + s);
  a.addEventListener('input', () => a.value = a.value.replace(/[^0-9.]/g, ''));
  a.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const v = parseFloat(a.value);
    if (!(v > 0)) return toast('Enter a valid amount');
    if (locked()) return;
    pick = { s, v, i: 0 };
    showList();
  });
  l.addEventListener('keydown', e => {
    const n = OPTS[s].length;
    if (e.key === 'ArrowDown') { pick.i = (pick.i + 1) % n; showList(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { pick.i = (pick.i - 1 + n) % n; showList(); e.preventDefault(); }
    else if (e.key === 'Enter') choose(pick.i);
    else if (e.key === 'Escape') { closeList(); a.focus(); }
    else {                                   // first letter jumps to an option
      const k = e.key.toLowerCase();
      const m = OPTS[s].map((o, i) => i).filter(i => OPTS[s][i][0].toLowerCase() === k);
      if (m.length) { pick.i = m.find(i => i > pick.i) ?? m[0]; showList(); }
    }
  });
});
function showList() {
  const l = $('list-' + pick.s);
  l.innerHTML = OPTS[pick.s].map((o, i) => `<div class="opt ${i === pick.i ? 'on' : ''}" onclick="choose(${i})">${o}</div>`).join('');
  l.hidden = false; l.focus();
}
function closeList() { ['in', 'out'].forEach(s => $('list-' + s).hidden = true); }
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function choose(i) {
  const { s, v } = pick;
  const label = OPTS[s][i];
  closeList();
  pick = null;
  if (label === 'Udhary' || label === 'Udhary Jama') askName(s, v, label);
  else finish(s, v, label, '');
}
function finish(s, v, label, note) {
  add(s, v, label, note);
  const a = $('amt-' + s); a.value = ''; a.focus();
}
// small box to type the person's name (Enter = save)
function askName(s, v, label) {
  dlg.innerHTML = `<h3>${label}: ${fmt(v)}</h3>
    <label>${s === 'in' ? 'Name of the person whose udhary came' : 'Name of the person to whom money is given'}</label>
    <input id="nm" placeholder="Type name" autocomplete="off">
    <div class="row"><button class="p" id="nok">Save</button><button id="nsk">Skip name</button></div>`;
  const n = $('nm');
  const save1 = name => { dlg.close(); finish(s, v, label, name); };
  $('nok').onclick = () => save1(n.value.trim());
  $('nsk').onclick = () => save1('');
  n.onkeydown = e => { if (e.key === 'Enter') save1(n.value.trim()); };
  dlg.showModal(); n.focus();
}

// ---------- Tally (day-end hisab) ----------
function tally() {
  const d = day(), i = sum(d.entries, 'in'), o = sum(d.entries, 'out'), box = r2(i - o);
  dlg.innerHTML = `<h3>Tally - ${date}</h3>
    <p>Total Incoming: <b>${fmt(i)}</b></p>
    <p>Total Outgoing: <b>${fmt(o)}</b></p>
    <p>Cash should be in box (Incoming − Outgoing): <b>${fmt(box)}</b></p>
    <label>Cash counted in box</label>
    <input id="cnt" inputmode="decimal" value="${d.counted ?? ''}">
    <div id="res"></div>
    <div class="row"><button class="p" id="cls">Close Day</button><button onclick="dlg.close()">Cancel</button></div>`;
  const c = $('cnt'), res = $('res');
  const upd = () => {
    c.value = c.value.replace(/[^0-9.]/g, '');
    const v = parseFloat(c.value);
    if (isNaN(v)) { res.textContent = ''; return null; }
    const df = r2(v - box);
    res.textContent = stat(df);
    res.style.color = df === 0 ? '#15803d' : df > 0 ? '#1e40af' : '#b91c1c';
    return { v, df };
  };
  c.oninput = upd; upd();
  c.onkeydown = e => { if (e.key === 'Enter') $('cls').click(); };
  $('cls').onclick = () => {
    const x = upd();
    if (!x) return toast('Enter the counted cash');
    Object.assign(d, { closed: true, counted: x.v, diff: x.df, status: stat(x.df) });
    save(); dlg.close(); render();
  };
  dlg.showModal(); c.focus();
}

// ---------- History ----------
function history() {
  const ks = Object.keys(db.days).filter(k => db.days[k].entries.length).sort().reverse();
  dlg.innerHTML = '<h3>History (tap a day to open)</h3><div style="max-height:60vh;overflow:auto"><table><tr><th>Date</th><th>In</th><th>Out</th><th>Status</th></tr>' +
    ks.map(k => { const x = db.days[k];
      return `<tr onclick="go('${k}')" style="cursor:pointer"><td>${k}</td><td>${fmt(sum(x.entries, 'in'))}</td><td>${fmt(sum(x.entries, 'out'))}</td><td>${x.closed ? x.status : 'Not closed'}</td></tr>`;
    }).join('') + '</table></div><div class="row"><button onclick="dlg.close()">Close</button></div>';
  dlg.showModal();
}
function go(k) { date = k; dlg.close(); render(); }

// ---------- Buttons ----------
const shift = n => { const d = new Date(date + 'T00:00:00'); d.setDate(d.getDate() + n); date = d.toLocaleDateString('en-CA'); render(); };
$('prev').onclick = () => shift(-1);
$('next').onclick = () => shift(1);
$('date').onchange = e => { if (e.target.value) { date = e.target.value; render(); } };
$('tally').onclick = tally;
$('hist').onclick = history;
$('prt').onclick = () => print();
$('bak').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], { type: 'application/json' }));
  a.download = 'cashbox-backup-' + date + '.json';
  a.click();
};
$('rst').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!j.days) throw 0;
      if (confirm('Replace ALL current data with this backup?')) { db = j; save(); render(); toast('Restored'); }
    } catch (x) { alert('This is not a valid backup file'); }
  };
  r.readAsText(f); e.target.value = '';
};

// ---------- Start ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
render();
$('amt-in').focus();
</script>
</body>
</html>
